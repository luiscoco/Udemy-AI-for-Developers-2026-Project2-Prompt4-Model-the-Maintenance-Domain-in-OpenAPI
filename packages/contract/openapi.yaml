openapi: 3.1.0
info:
  title: Equipment Maintenance Hub API
  version: 0.1.0
  description: Shared contract. TypeScript and Pydantic v2 models are generated from this file.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    # --- Work order domain ---------------------------------------------------
    # Lifecycle (enforced by the backend, not expressible in the schema):
    #   reported --triage--> triaged --schedule--> scheduled --start--> in_progress --complete--> completed
    #   triaged --cancel--> cancelled, scheduled --cancel--> cancelled
    # completed and cancelled are final states.
    WorkOrderState:
      type: string
      description: Lifecycle state of a work order. `completed` and `cancelled` are final.
      enum: [reported, triaged, scheduled, in_progress, completed, cancelled]

    WorkOrderAction:
      type: string
      description: >-
        Lifecycle transition. triage: reported→triaged; schedule: triaged→scheduled;
        start: scheduled→in_progress; complete: in_progress→completed;
        cancel: triaged|scheduled→cancelled.
      enum: [triage, schedule, start, complete, cancel]

    Priority:
      type: string
      enum: [low, medium, high, critical]

    Asset:
      type: object
      required: [id, tag, name, location]
      properties:
        id:
          type: string
          minLength: 1
        tag:
          type: string
          minLength: 1
          description: Human-readable asset tag (e.g. a plate or inventory code).
        name:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1

    Technician:
      type: object
      required: [id, name, specialty]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        specialty:
          type: string
          minLength: 1

    WorkOrder:
      type: object
      required:
        [id, reference, assetId, title, description, priority, state, technicianId, reportedAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
        reference:
          type: string
          minLength: 1
          description: Human-readable work order reference, assigned by the server.
        assetId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        description:
          type: string
        priority:
          $ref: "#/components/schemas/Priority"
        state:
          $ref: "#/components/schemas/WorkOrderState"
        technicianId:
          type: [string, "null"]
          minLength: 1
          description: Assigned technician, or null while unassigned. Always present.
        reportedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NewWorkOrder:
      type: object
      required: [assetId, title, description, priority]
      properties:
        assetId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        description:
          type: string
        priority:
          $ref: "#/components/schemas/Priority"

    TransitionCommand:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/WorkOrderAction"

    AssignmentCommand:
      type: object
      required: [technicianId]
      properties:
        technicianId:
          type: string
          minLength: 1

    DashboardSummary:
      type: object
      required: [totalOpen, criticalOpen, unassigned, byState]
      properties:
        totalOpen:
          type: integer
          minimum: 0
          description: Work orders not in a final state (completed or cancelled).
        criticalOpen:
          type: integer
          minimum: 0
          description: Open work orders with priority `critical`.
        unassigned:
          type: integer
          minimum: 0
          description: Open work orders with no technician assigned.
        byState:
          type: object
          description: Count of work orders per state. Every state is always present.
          required: [reported, triaged, scheduled, in_progress, completed, cancelled]
          additionalProperties: false
          properties:
            reported:
              type: integer
              minimum: 0
            triaged:
              type: integer
              minimum: 0
            scheduled:
              type: integer
              minimum: 0
            in_progress:
              type: integer
              minimum: 0
            completed:
              type: integer
              minimum: 0
            cancelled:
              type: integer
              minimum: 0

    ApiError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
        details:
          type: object
          description: Optional structured context about the error (e.g. field errors).
          additionalProperties: true
